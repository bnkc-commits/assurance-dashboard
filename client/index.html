<form id="loginForm">
  <input type="text" id="username" placeholder="Identifiant" required />
  <input type="password" id="password" placeholder="Mot de passe" required />
  <button type="submit">Connexion</button>
</form>

<form id="registerForm">
  <input type="text" id="name" placeholder="Nom complet" required />
  <input type="text" id="usernameRegister" placeholder="Identifiant" required />
  <input type="password" id="passwordRegister" placeholder="Mot de passe" required />
  <button type="submit">Inscription</button>
</form>
